<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dünyanın En Eşsiz Annesine ❤️</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(-45deg, #ff9a9e, #fecfef, #feada6, #f3a8b1);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            text-align: center;
            z-index: 10;
            width: 100%;
            max-width: 500px;
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            border: 2px solid rgba(255, 255, 255, 0.5);
            transform: scale(0.95);
            animation: fadeIn 1s ease-out forwards;
        }

        @keyframes fadeIn {
            to { transform: scale(1); }
        }

        h1 {
            color: #ff3366;
            font-size: 2.8rem;
            margin-top: 0;
            margin-bottom: 15px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.05);
        }

        .main-text {
            color: #4a4a4a;
            font-size: 1.25rem;
            line-height: 1.6;
            margin-bottom: 25px;
            font-weight: 500;
        }

        /* Hediye Kutusu Alanı */
        .gift-area {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        .gift-box {
            font-size: 2.5rem;
            cursor: pointer;
            transition: transform 0.3s, filter 0.3s;
            user-select: none;
        }

        .gift-box:hover {
            transform: scale(1.2) rotate(5deg);
            filter: drop-shadow(0 5px 5px rgba(0,0,0,0.15));
        }

        .gift-note {
            min-height: 50px;
            color: #ff3366;
            font-size: 1.1rem;
            font-style: italic;
            font-weight: bold;
            margin-bottom: 15px;
            transition: all 0.3s;
        }

        .btn {
            background: linear-gradient(135deg, #ff3366, #ff6699);
            color: white;
            border: none;
            padding: 15px 35px;
            font-size: 1.1rem;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 51, 102, 0.3);
            transition: all 0.3s;
            font-weight: bold;
            outline: none;
        }

        .btn:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 8px 20px rgba(255, 51, 102, 0.4);
        }

        .btn:active {
            transform: translateY(1px);
        }

        /* Efekt Elemanları */
        .particle {
            position: absolute;
            pointer-events: none;
            animation: fly linear forwards;
            z-index: 1;
        }

        @keyframes fly {
            0% {
                transform: translateY(100vh) translateX(0) scale(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-10vh) translateX(var(--x-move)) scale(var(--scale)) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <h1>Canım Anneme ❤️</h1>
            <p class="main-text">Dünyanın en tatlı, en fedakar annesi... Hayatıma kattığın tüm güzellikler için teşekkür ederim. Sürprizlerini görmek için kutulara tıkla!</p>
            
            <div class="gift-area">
                <div class="gift-box" onclick="openGift(this, 'Sen benim kutup yıldızımsın, yolumu hep seninle buluyorum! ✨')">🎁</div>
                <div class="gift-box" onclick="openGift(this, 'Dünyanın en lezzetli yemeklerini yapan şefine kocaman bir sarılma! 🍳💝')">🎁</div>
                <div class="gift-box" onclick="openGift(this, 'Gülüşünle evimizi, sevginle içimizi ısıtan canım annem! 🌸')">🎁</div>
            </div>

            <div class="gift-note" id="note-display">Kutulardan birini seçmek ister misin?</div>

            <button class="btn" onclick="celebrate()">Seni Dünyalar Kadar Seviyorum!</button>
        </div>
    </div>

    <script>
        const emojis = ['❤️', '💖', '🌸', '✨', '💕', '🌹', '👑'];
        
        function createParticle(isBurst = false, clickX, clickY) {
            const particle = document.createElement('div');
            particle.classList.add('particle');
            particle.innerHTML = emojis[Math.floor(Math.random() * emojis.length)];
            
            const scale = Math.random() * 1.5 + 0.8;
            particle.style.setProperty('--scale', scale);
            
            if (isBurst) {
                // Patlama efekti için rastgele yönlere fırlatma
                particle.style.left = clickX + 'px';
                particle.style.top = clickY + 'px';
                const angle = Math.random() * Math.PI * 2;
                const velocity = Math.random() * 300 + 100;
                const xMove = Math.cos(angle) * velocity;
                const yMove = Math.sin(angle) * velocity;
                
                particle.style.animate = 'none'; 
                particle.animate([
                    { transform: 'translate(0, 0) scale(1)', opacity: 1 },
                    { transform: `translate(${xMove}px, ${yMove}px) scale(0)`, opacity: 0 }
                ], {
                    duration: Math.random() * 1000 + 1000,
                    easing: 'cubic-bezier(0.1, 0.8, 0.3, 1)',
                    fill: 'forwards'
                });
            } else {
                // Alttan yukarı yavaşça yükselme efekti
                particle.style.left = Math.random() * 100 + 'vw';
                particle.style.bottom = '-50px';
                particle.style.setProperty('--x-move', (Math.random() * 200 - 100) + 'px');
                particle.style.animationDuration = Math.random() * 3 + 4 + 's';
            }
            
            document.body.appendChild(particle);
            setTimeout(() => particle.remove(), 5000);
        }

        // Arka planda sürekli hafif hafif uçuşan kalpler
        setInterval(() => createParticle(false), 800);

        // Hediye kutusu açma fonksiyonu
        function openGift(element, message) {
            element.innerHTML = '💝'; 
            element.style.transform = 'scale(1.3)';
            element.style.pointerEvents = 'none';
            
            const display = document.getElementById('note-display');
            display.style.opacity = 0;
            
            setTimeout(() => {
                display.innerText = message;
                display.style.opacity = 1;
            }, 200);

            // Kutu açıldığında küçük bir patlama efekti
            const rect = element.getBoundingClientRect();
            for(let i = 0; i < 10; i++) {
                createParticle(true, rect.left + rect.width/2, rect.top + rect.height/2);
            }
        }

        // Büyük buton patlaması
        function celebrate() {
            // Ekranın her yerinden kalpler fırlasın
            for (let i = 0; i < 50; i++) {
                setTimeout(() => {
                    const x = Math.random() * window.innerWidth;
                    const y = Math.random() * window.innerHeight;
                    createParticle(true, x, y);
                }, i * 15);
            }
        }
    </script>
</body>
</html>
